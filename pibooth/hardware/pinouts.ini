# Mapping between the physical header pin numbers used in pibooth.cfg (BOARD
# numbering) and the GPIO line exposed by the kernel, for each supported board.
#
# 'detect' is matched against /proc/device-tree/model to pick the board.
#
# Values are either:
#   - a global GPIO number as documented by the board vendor (ex: 465), which
#     is resolved into a (chip, offset) pair at runtime,
#   - or an explicit 'chip:offset' pair (ex: 1:19) when the global numbering
#     is not available on the running kernel.
#
# Raspberry Pi boards need no table: gpiozero already knows their headers.

[raspberry-pi]
detect = Raspberry Pi
backend = gpiozero

# Amlogic A311D2. Checked on the Khadas vendor kernel 5.15: the header lines
# sit on gpiochip0 (periphs-banks, global numbers 355 to 511).
# Source: https://docs.khadas.com/products/sbc/vim4/applications/gpio/40pin-header
# Pins absent from this table carry power, ground or a dedicated function
# (USB hub, MCU, ADC, UART console) and cannot be used as GPIO.
[khadas-vim4]
detect = Khadas VIM4
backend = chardev
13 = 420
15 = 491
16 = 490
22 = 501
23 = 502
25 = 466
26 = 467
29 = 447
30 = 446
31 = 449
32 = 448
33 = 450
35 = 492
36 = 464
37 = 465
39 = 417
